# 「たより」をGitHub上のエミュレータ(仮想スマホ)で起動し、画面のスクリーンショットを撮る。
# 結果は実行ページ下部の Artifacts「tayori-emulator-screens」からダウンロードできる。
name: Tayori Emulator Screenshots

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/tayori-emulator.yml"
      - "tayori/ci/**"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: tayori
        run: ./gradlew :app:assembleDebug --console=plain

      # エミュレータを高速に動かすための仮想化機能(KVM)を有効にする
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: tayori
          script: bash ci/emulator-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayori-emulator-screens
          path: tayori/ci-out/
