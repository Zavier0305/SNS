# 「たより」Androidアプリ(tayori/)のテストとAPKの組み立て。
# できたAPKは、Actions の実行結果ページ下部の Artifacts からダウンロードできる。
name: Tayori Android

on:
  push:
    branches: ["**"]
    paths:
      - "tayori/**"
      - ".github/workflows/tayori-android.yml"
  pull_request:
    paths:
      - "tayori/**"
  workflow_dispatch: # GitHubの画面から手動でも実行できる

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # できたAPKをブランチに保存するため
    defaults:
      run:
        working-directory: tayori
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest には Android SDK が入っていて ANDROID_HOME が設定済みなので、:app も読み込まれる
      - name: Unit tests (relay logic)
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tayori-debug-apk
          path: tayori/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ログイン不要で直接ダウンロードできるよう、APKを tayori/dist/tayori.apk としてブランチに保存する
      - name: Commit APK to the branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p tayori/dist
          cp tayori/app/build/outputs/apk/debug/app-debug.apk tayori/dist/tayori.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayori/dist/tayori.apk
          git diff --cached --quiet && exit 0
          git commit -m "Update tayori.apk [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
