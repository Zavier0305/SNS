name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium

      - name: Start server and wait for it to be ready
        run: |
          npx next start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "server did not become ready in time" >&2
          exit 1

      - name: Run smoke test
        run: npm run test:smoke
